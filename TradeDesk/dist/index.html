    <script>
      /* Apply the stored theme before React mounts (no flash of the wrong
       * theme). Values: auto | light | dark, key td-theme. Auto (or
       * absent) leaves data-theme unset here — the CSS media query then
       * follows the device setting. */
      try {
        var __tdTheme = localStorage.getItem('td-theme');
        if (__tdTheme === 'light' || __tdTheme === 'dark' || __tdTheme === 'auto') {
          document.documentElement.setAttribute('data-theme', __tdTheme);
        }
      } catch (e) {}
    </script>
