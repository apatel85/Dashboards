# Spike S1/S2 runner (manual). Throwaway evidence for AGENTLOG.
name: voiceflow-spike
on:
  workflow_dispatch:
  push:
    paths: ["VoiceFlowAI/app/spike/**", "VoiceFlowAI/app/android/**", "VoiceFlowAI/app/lib/ime_main.dart", ".github/workflows/voiceflow-spike.yml"]
defaults:
  run:
    shell: bash
    working-directory: VoiceFlowAI/app/spike/s1
jobs:
  s1-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: "3.50.0"
          channel: stable
      - name: Fetch model (pinned SHA-256)
        run: |
          curl -sL https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-base.en.tar.bz2 -o w.tar.bz2
          echo "475bc7052ce299c007f6d5d5407ba8601f819a2867f6eecee510ed17df581542  w.tar.bz2" | sha256sum -c -
          tar xjf w.tar.bz2
      - run: dart pub get
      - name: S1 transcribe + timing (exe with DLLs beside it, like a real app)
        run: |
          # `dart run` loads Windows' own old System32 onnxruntime.dll (v1.17.1) and
          # crashes. A real app ships its DLLs next to the exe, which Windows searches first.
          mkdir out
          dart compile exe s1.dart -o out/s1.exe
          PKG="$(cygpath "$LOCALAPPDATA")/Pub/Cache/hosted/pub.dev/sherpa_onnx_windows-2.0.1/windows/x64"
          cp "$PKG"/*.dll out/
          M=sherpa-onnx-whisper-base.en
          ./out/s1.exe $M base.en-encoder.int8.onnx base.en-decoder.int8.onnx base.en-tokens.txt $M/test_wavs/0.wav $M/test_wavs/1.wav | tee s1-windows.log
      - uses: actions/upload-artifact@v4.6.0
        with:
          name: s1-windows-log
          path: VoiceFlowAI/app/spike/s1/s1-windows.log
  s2-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
        working-directory: VoiceFlowAI/app/spike/s2
    steps:
      - uses: actions/checkout@v4.2.2
      - name: S2 SendInput paste + clipboard restore (5 runs)
        run: ./s2.ps1 *>&1 | Tee-Object -FilePath s2-windows.log
      - uses: actions/upload-artifact@v4.6.0
        if: always()
        with:
          name: s2-windows-log
          path: VoiceFlowAI/app/spike/s2/s2-windows.log
  s3-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: Build release APK (x86_64, debug-signed)
        shell: bash
        working-directory: VoiceFlowAI/app
        run: |
          flutter pub get
          # CI-only (not committed): make the APK debuggable so the test can use `run-as`
          # to place the model in the app's private dir. Still an AOT release build.
          sed -i 's|android:label="voiceflow_app"|android:label="voiceflow_app" android:debuggable="true"|' android/app/src/main/AndroidManifest.xml
          grep -c 'android:debuggable="true"' android/app/src/main/AndroidManifest.xml
          flutter build apk --release --target-platform android-x64 2>&1 | tail -n 40
      - name: Fetch STT model for the emulator test (pinned SHA-256)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          curl -sL https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-base.en.tar.bz2 -o w.tar.bz2
          echo "475bc7052ce299c007f6d5d5407ba8601f819a2867f6eecee510ed17df581542  w.tar.bz2" | sha256sum -c -
          tar xjf w.tar.bz2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: S3 emulator test
        uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash -o pipefail -c 'bash VoiceFlowAI/app/spike/s3/run.sh | tee s3-android.log'
      - uses: actions/upload-artifact@v4.6.0
        if: always()
        with:
          name: s3-android-log
          path: s3-android.log
          if-no-files-found: warn
