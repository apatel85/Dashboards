# Deploys the polish proxy and syncs the Gemini key from the GitHub secret
# into the Supabase function secret. The key never enters the app or repo.
# Required repo secrets: GEMINI_API_KEY, SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF
name: voiceflow-polish-deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["VoiceFlowAI/supabase/**"]
concurrency:
  group: voiceflow-polish-deploy
  cancel-in-progress: false
defaults:
  run:
    working-directory: VoiceFlowAI
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: supabase/setup-cli@v1.5.0
        with:
          version: latest
      - name: Fail early if a secret is missing
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF GEMINI_API_KEY; do
            [ -n "${!v}" ] || { echo "::error::repo secret $v is not set"; exit 1; }
          done
      - name: Sync Gemini key to function secret
        run: supabase secrets set GEMINI_API_KEY="$GEMINI_API_KEY" --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy function
        run: supabase functions deploy voiceflow-polish --project-ref "$SUPABASE_PROJECT_REF"
