name: voiceflow-android
on:
  push:
    paths: ["VoiceFlowAI/app/android/**", "VoiceFlowAI/app/lib/**", "VoiceFlowAI/app/assets/**", "VoiceFlowAI/app/pubspec.yaml", "VoiceFlowAI/packages/core/**", ".github/workflows/voiceflow-android.yml"]
  workflow_dispatch:
jobs:
  ime-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: Build e2e APK (x86_64, debug-signed; has a test seam, never published)
        working-directory: VoiceFlowAI/app
        run: |
          flutter pub get
          flutter build apk --release --flavor e2e --target-platform android-x64 2>&1 | tail -n 40
      - name: Prod flavor must contain no test seam
        working-directory: VoiceFlowAI/app
        run: |
          flutter build apk --release --flavor prod --target-platform android-x64 2>&1 | tail -n 5
          sudo apt-get install -y -qq aapt >/dev/null 2>&1 || true
          APK=build/app/outputs/flutter-apk/app-prod-release.apk
          ! unzip -p "$APK" classes.dex | strings | grep -q "E2E_DICTATE_WAV"
          ! (aapt dump badging "$APK" 2>/dev/null | grep -q MANAGE_EXTERNAL_STORAGE)
          echo "prod APK clean"
      - name: Fetch STT model for the emulator test (pinned SHA-256)
        run: |
          curl -sL https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-base.en.tar.bz2 -o w.tar.bz2
          echo "475bc7052ce299c007f6d5d5407ba8601f819a2867f6eecee510ed17df581542  w.tar.bz2" | sha256sum -c -
          tar xjf w.tar.bz2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Keyboard emulator test
        uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash -o pipefail -c 'bash VoiceFlowAI/app/android/e2e/run.sh | tee android-e2e.log'
      - uses: actions/upload-artifact@v4.6.0
        if: always()
        with:
          name: android-e2e-log
          path: android-e2e.log
          if-no-files-found: warn
