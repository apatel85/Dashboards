name: Update Earnings Calendar

on:
  schedule:
    # Every Friday at 22:00 UTC = 5:00 PM ET (EST) / 6:00 PM ET (EDT)
    - cron: '0 22 * * 5'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if no data changes'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  refresh:
    name: Fetch Earnings Data & Rebuild
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: EarningAnalysis/package-lock.json

      # ── Fetch new earnings data ──────────────────────────────────────────────
      - name: Fetch rolling earnings calendar
        working-directory: EarningAnalysis
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: node scripts/fetch-earnings.mjs

      # ── Build the React app ──────────────────────────────────────────────────
      - name: Install dependencies
        working-directory: EarningAnalysis
        run: npm ci

      - name: Build
        working-directory: EarningAnalysis
        run: npm run build

      # ── Commit & push if anything changed ───────────────────────────────────
      - name: Commit and push updated data + dist
        run: |
          git config user.name  "earnings-bot[bot]"
          git config user.email "earnings-bot@noreply.github.com"

          git add EarningAnalysis/public/data/earnings.json
          git add EarningAnalysis/public/data/meta.json
          git add EarningAnalysis/dist/

          # Only commit if there are staged changes
          if git diff --staged --quiet; then
            echo "No data changes — skipping commit."
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "auto: refresh earnings calendar ${DATE} [skip ci]"
            git push
            echo "Pushed updated earnings data."
          fi
