name: ETL Refresh + Deploy

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  push:
    branches: [main]         # also runs on every push
  workflow_dispatch:          # manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ── Job 1: Run ETL and export JSON data ──────────────────────────────────
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd CongressTradeTracker
          pip install flask requests pdfplumber beautifulsoup4 lxml apscheduler pandas

      - name: Init DB and run ETL
        run: |
          cd CongressTradeTracker
          mkdir -p output
          python -c "
import sqlite3
conn = sqlite3.connect('output/master_trades.db')
conn.executescript(open('schema.sql').read())
conn.commit()
conn.close()
print('DB ready')
"
          python etl.py      || echo 'ETL scaffold - no live data yet'
          python reconcile.py || echo 'Reconcile scaffold - no live data yet'

      - name: Export data to JSON
        run: |
          cd CongressTradeTracker
          python - <<'PYEOF'
import sqlite3, json, os
from datetime import datetime, timezone

os.makedirs('web/data', exist_ok=True)
conn = sqlite3.connect('output/master_trades.db')
conn.row_factory = sqlite3.Row

trades = [dict(r) for r in conn.execute(
    'SELECT * FROM master_trades ORDER BY transaction_date DESC LIMIT 5000'
).fetchall()]

with open('web/data/master_trades.json', 'w') as f:
    json.dump(trades, f)

last_run = conn.execute(
    'SELECT started_at FROM refresh_log ORDER BY started_at DESC LIMIT 1'
).fetchone()

meta = {
    'last_run': last_run[0] if last_run else datetime.now(timezone.utc).isoformat(),
    'total': len(trades),
    'exported_at': datetime.now(timezone.utc).isoformat(),
    'sample': len(trades) == 0
}
with open('web/data/meta.json', 'w') as f:
    json.dump(meta, f, indent=2)

conn.close()
print(f'Exported {len(trades)} trades')
PYEOF

      - name: Commit data files back to repo
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add CongressTradeTracker/web/data/
          git diff --staged --quiet || git commit -m "chore: auto-refresh trade data $(date -u +%Y-%m-%dT%H:%M)Z"
          git push

      - name: Prepare _site for Pages
        run: |
          mkdir -p _site
          cp -r CongressTradeTracker/web/. _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # ── Job 2: Deploy to GitHub Pages (only if Pages is enabled) ────────────
  deploy:
    needs: etl
    runs-on: ubuntu-latest
    # This job will be skipped gracefully if Pages is not configured
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
