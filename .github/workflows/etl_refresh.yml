name: ETL Refresh + Deploy

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install flask requests beautifulsoup4 lxml pandas

      - name: Init DB
        run: |
          cd CongressTradeTracker
          mkdir -p output
          python -c "
import sqlite3
conn = sqlite3.connect('output/master_trades.db')
conn.executescript(open('schema.sql').read())
conn.commit()
conn.close()
print('DB ready')
"

      - name: Run ETL (scaffold mode)
        run: |
          cd CongressTradeTracker
          python etl.py      2>&1 || echo 'ETL in scaffold mode - no live data'
          python reconcile.py 2>&1 || echo 'Reconcile in scaffold mode'

      - name: Export JSON for web app
        run: |
          cd CongressTradeTracker
          python - <<'PYEOF'
import sqlite3, json, os
from datetime import datetime, timezone

os.makedirs('web/data', exist_ok=True)
conn = sqlite3.connect('output/master_trades.db')
conn.row_factory = sqlite3.Row

trades = [dict(r) for r in conn.execute(
    'SELECT * FROM master_trades ORDER BY transaction_date DESC LIMIT 5000'
).fetchall()]

with open('web/data/master_trades.json', 'w') as f:
    json.dump(trades, f)

last_run = conn.execute(
    'SELECT started_at FROM refresh_log ORDER BY started_at DESC LIMIT 1'
).fetchone()

meta = {
    'last_run': last_run[0] if last_run else datetime.now(timezone.utc).isoformat(),
    'total': len(trades),
    'exported_at': datetime.now(timezone.utc).isoformat(),
    'sample': len(trades) == 0
}
with open('web/data/meta.json', 'w') as f:
    json.dump(meta, f, indent=2)

conn.close()
print(f'Done: {len(trades)} trades exported')
PYEOF

      - name: Copy web files to docs/ (GitHub Pages source)
        run: |
          mkdir -p docs
          cp -r CongressTradeTracker/web/. docs/

      - name: Commit results
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add CongressTradeTracker/web/data/ docs/
          git diff --staged --quiet && echo 'No changes' || (
            git commit -m "chore: auto-refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          )
