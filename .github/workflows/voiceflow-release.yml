name: voiceflow-release
# Builds the Windows installer + portable zip and the Android APK, proves the installer works
# (silent install, launch, uninstall) and the APK is clean (right package, no test seam, no
# storage permission), and - only when VoiceFlowAI/VERSION changed in the push - publishes ONE
# GitHub PRE-release `voiceflow-v<VERSION>` with both.
on:
  push:
    paths:
      - "VoiceFlowAI/VERSION"
      - "VoiceFlowAI/installer/**"
      - "VoiceFlowAI/app/android/**"
      - ".github/workflows/voiceflow-release.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a pre-release from this run"
        type: boolean
        default: false
concurrency:
  group: voiceflow-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
defaults:
  run:
    shell: pwsh
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Read version and decide whether to publish
        id: v
        run: |
          $ver = (Get-Content VoiceFlowAI/VERSION -Raw).Trim()
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION '$ver' is not x.y.z" }
          $publish = $false
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $publish = '${{ inputs.publish }}' -eq 'true' }
          elseif ('${{ github.event.before }}' -notmatch '^0+$') {
            $changed = git diff --name-only '${{ github.event.before }}' '${{ github.sha }}' -- VoiceFlowAI/VERSION
            $publish = [bool]$changed
          }
          "version=$ver" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Output "version=$ver publish=$publish"
      - uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: Build Windows release
        working-directory: VoiceFlowAI/app
        run: |
          flutter pub get
          flutter build windows --release --dart-define=APP_VERSION=${{ steps.v.outputs.version }} 2>&1 | Select-Object -Last 15
      - name: Bundle the Visual C++ runtime next to the exe (app-local, so nothing else to install)
        run: |
          $rel = "VoiceFlowAI/app/build/windows/x64/runner/Release"
          foreach ($d in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            $src = Join-Path $env:WINDIR "System32/$d"
            if (-not (Test-Path $src)) { throw "$d not found on the runner" }
            Copy-Item $src $rel -Force
          }
          Copy-Item VoiceFlowAI/installer/README-portable.txt $rel -Force
          Get-ChildItem $rel -Filter *.dll | Select-Object Name, Length | Format-Table | Out-String | Write-Output
      - name: Portable zip
        run: |
          New-Item -ItemType Directory -Force VoiceFlowAI/dist | Out-Null
          Compress-Archive -Path "VoiceFlowAI/app/build/windows/x64/runner/Release/*" `
            -DestinationPath "VoiceFlowAI/dist/VoiceFlow-portable-${{ steps.v.outputs.version }}.zip"
      - name: Build the installer (Inno Setup)
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            foreach ($p in "C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe") {
              if (Test-Path $p) { $iscc = $p; break }
            }
          }
          if (-not $iscc) { choco install innosetup -y --no-progress | Out-Null; $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          Write-Output "ISCC: $iscc"
          & $iscc "/DAppVersion=${{ steps.v.outputs.version }}" VoiceFlowAI/installer/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-ChildItem VoiceFlowAI/dist | Select-Object Name, Length | Format-Table | Out-String | Write-Output
      - name: TEST the installer - silent install, launch, still alive, uninstall, gone
        run: |
          $setup = (Resolve-Path "VoiceFlowAI/dist/VoiceFlow-Setup-${{ steps.v.outputs.version }}.exe").Path
          $dir = Join-Path $env:RUNNER_TEMP "VoiceFlowInstalled"
          $log = Join-Path $env:RUNNER_TEMP "setup.log"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=`"$dir`"","/LOG=`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "installer exit code $($p.ExitCode)" }
          foreach ($f in 'voiceflow_app.exe','flutter_windows.dll','msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll','data\app.so','unins000.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing after install: $f" }
          }
          Write-Output "install_ok files=$((Get-ChildItem $dir -Recurse -File).Count)"
          $exe = Start-Process (Join-Path $dir 'voiceflow_app.exe') -PassThru
          Start-Sleep -Seconds 10
          $exe.Refresh()
          if ($exe.HasExited) { throw "installed app exited early with code $($exe.ExitCode)" }
          Write-Output "installed_app_alive_after_10s=True ws_mb=$([math]::Round($exe.WorkingSet64/1MB))"
          Write-Output ("appdata_dirs: " + ((Get-ChildItem $env:APPDATA -Directory | Select-Object -ExpandProperty Name) -join ', '))
          Stop-Process -Id $exe.Id -Force
          Start-Sleep -Seconds 2
          $u = Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstaller exit code $($u.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path (Join-Path $dir 'voiceflow_app.exe')) { throw "exe still present after uninstall" }
          Write-Output "uninstall_ok"
      - uses: actions/upload-artifact@v4.6.0
        with:
          name: voiceflow-windows-dist
          path: VoiceFlowAI/dist/*

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: Signing key (optional)
        env:
          KS_B64: ${{ secrets.VOICEFLOW_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.VOICEFLOW_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.VOICEFLOW_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.VOICEFLOW_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/vf.jks"
            {
              echo "VF_KEYSTORE_PATH=$RUNNER_TEMP/vf.jks"
              echo "VF_KEYSTORE_PASSWORD=$KS_PASS"
              echo "VF_KEY_ALIAS=$KS_ALIAS"
              echo "VF_KEY_PASSWORD=${KS_KEYPASS:-$KS_PASS}"
            } >> "$GITHUB_ENV"
            echo "SIGNED=release-key" >> "$GITHUB_ENV"
          else
            echo "SIGNED=debug-key" >> "$GITHUB_ENV"
            echo "No signing secrets: the APK will be debug-signed (fine to sideload; a later real key means uninstall + reinstall)."
          fi
      - name: Build the APK (prod flavor, arm64)
        working-directory: VoiceFlowAI/app
        run: |
          VER=$(tr -d '[:space:]' < ../VERSION)
          flutter pub get
          flutter build apk --release --flavor prod --target-platform android-arm64 \
            --build-name "$VER" --build-number "${{ github.run_number }}" \
            --dart-define=APP_VERSION="$VER" 2>&1 | tail -n 15
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-prod-release.apk "../dist/VoiceFlow-$VER-arm64.apk"
          ls -l ../dist
      - name: Check the APK
        working-directory: VoiceFlowAI/dist
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -1)
          APK=$(ls VoiceFlow-*-arm64.apk)
          $AAPT dump badging "$APK" > badging.txt
          grep -q "package: name='dev.voiceflow.voiceflow_app'" badging.txt   # proves aapt2 really read it
          grep -E "^sdkVersion|^targetSdkVersion|^uses-permission|native-code" badging.txt
          if grep -q MANAGE_EXTERNAL_STORAGE badging.txt; then echo "APK has the storage permission"; exit 1; fi
          grep -q "android.permission.RECORD_AUDIO" badging.txt
          grep -q "name='android.permission.INTERNET'" badging.txt || { echo "APK lacks INTERNET: the model download would fail on a phone"; exit 1; }
          grep -q "native-code: 'arm64-v8a'" badging.txt
          if unzip -p "$APK" classes.dex | strings | grep -q E2E_DICTATE_WAV; then echo "APK contains the test seam"; exit 1; fi
          rm badging.txt
          echo "apk_clean signed_with=$SIGNED"
      - uses: actions/upload-artifact@v4.6.0
        with:
          name: voiceflow-android-dist
          path: VoiceFlowAI/dist/*

  publish:
    needs: [windows, android]
    if: needs.windows.outputs.publish == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4.1.8
        with:
          path: dist-in
          merge-multiple: true
      - name: Checksums, notes, pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VER: ${{ needs.windows.outputs.version }}
        run: |
          cd dist-in
          sha256sum *.exe *.zip *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          TAG="voiceflow-v$VER"
          cat > release-notes.md <<EOF
          **VoiceFlow $VER** - pre-release.

          **Windows**
          * Installer: \`VoiceFlow-Setup-$VER.exe\` (per-user, no admin needed)
          * Portable: \`VoiceFlow-portable-$VER.zip\` (unzip anywhere and run \`voiceflow_app.exe\`)
          * Windows will warn you (SmartScreen: "More info" -> "Run anyway") because the app is **not code-signed**. Some antivirus tools may also flag the global keyboard hook and synthesised keystrokes it uses to type into other apps.

          **Android keyboard**
          * \`VoiceFlow-$VER-arm64.apk\` for 64-bit ARM phones (Android 8+). Sideload it: allow "Install unknown apps" for your browser or file manager, open the APK, then follow the setup checklist inside the app (turn the keyboard on, choose it, allow the microphone, download the speech model once).
          * Debug-signed (no release key yet): Play Protect may warn. If a properly signed build replaces it later you will need to uninstall and reinstall once.
          * Only automated emulator tests have run so far; real-phone checks are still pending.
          * **Android APKs 0.3.1 and 0.4.0 could not download the speech model** (the network permission was missing from the release build). Use 0.5.0 or later.

          Verify downloads with the SHA-256 sums below; the source is in this repository. Everything works offline after the one-time model download (about 160 MB). Cloud polish is off by default.

          SHA-256:
          \`\`\`
          $(cat dist-in/SHA256SUMS.txt)
          \`\`\`
          EOF
          sed -i 's/^          //' release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-in/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md --prerelease
          else
            gh release create "$TAG" dist-in/* --prerelease --title "VoiceFlow $VER" --notes-file release-notes.md --target "${{ github.sha }}"
          fi
          gh release view "$TAG" --json url,isPrerelease,assets --jq '{url, isPrerelease, assets: [.assets[].name]}'
