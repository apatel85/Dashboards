<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&L Dashboard — Admin</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0d14;--surface:#0f1117;--card:#181c27;--border:#2a3045;
  --text:#e8eaf0;--muted:#6b7394;--teal:#0ecfbe;--teal-dim:rgba(14,207,190,.1);
  --red:#e74c3c;--red-dim:rgba(231,76,60,.12);--green:#2ecc71;--amber:#f1c40f;
  --shadow:0 2px 12px rgba(0,0,0,.4);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;font-size:14px;line-height:1.5}
a{color:var(--teal);text-decoration:none}

#login-screen{
  display:flex;align-items:center;justify-content:center;height:100vh;
  background:var(--bg);
}
.login-card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:40px 36px;width:100%;max-width:380px;text-align:center;
  box-shadow:var(--shadow);
}
.login-card h1{font-size:22px;font-weight:500;margin-bottom:4px}
.login-card h1 span{color:var(--teal);font-style:italic}
.login-card p{color:var(--muted);font-size:13px;margin-bottom:28px}
.field-group{margin-bottom:18px;text-align:left}
.field-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.field-input{
  width:100%;padding:10px 12px;background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;
  transition:border-color .15s;
}
.field-input:focus{border-color:var(--teal)}
.pin-boxes{display:flex;gap:12px;justify-content:center}
.pin-box{
  width:52px;height:60px;text-align:center;font-size:24px;
  background:var(--surface);color:var(--text);border:2px solid var(--border);
  border-radius:10px;outline:none;font-family:system-ui,sans-serif;
  caret-color:var(--teal);
}
.pin-box:focus{border-color:var(--teal)}
.login-error{color:var(--red);font-size:13px;margin-top:12px;min-height:20px}

.btn{
  font-size:12px;font-weight:500;padding:7px 14px;border-radius:6px;
  border:1px solid transparent;cursor:pointer;transition:all .15s;
  white-space:nowrap;display:inline-flex;align-items:center;gap:6px;
  font-family:system-ui,sans-serif;
}
.btn-primary{background:var(--teal);color:var(--bg);border-color:var(--teal)}
.btn-primary:hover{filter:brightness(1.1)}
.btn-outline{background:transparent;color:var(--text);border-color:var(--border)}
.btn-outline:hover{border-color:var(--teal);color:var(--teal)}
.btn-danger{background:var(--red-dim);color:var(--red);border-color:var(--red)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-login{
  width:100%;padding:12px;font-size:14px;margin-top:8px;border-radius:8px;
  background:var(--teal);color:var(--bg);border:none;cursor:pointer;
  font-weight:600;transition:filter .15s;
}
.btn-login:hover{filter:brightness(1.1)}

#app-shell{display:none;height:100vh;overflow:hidden;flex-direction:column}
#topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:54px;background:var(--surface);
  border-bottom:1px solid var(--border);flex-shrink:0;gap:12px;
}
#topbar h1{font-size:20px;font-weight:500;letter-spacing:-.3px;white-space:nowrap}
#topbar h1 span{color:var(--teal);font-style:italic}
.topbar-right{display:flex;align-items:center;gap:10px}
.admin-email{font-size:12px;color:var(--muted)}
#hamburger{display:none;background:none;border:none;color:var(--text);cursor:pointer;font-size:22px;padding:8px}

.tab-bar{
  display:flex;background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 24px;gap:0;flex-shrink:0;overflow-x:auto;
}
.tab-btn{
  padding:12px 20px;font-size:13px;color:var(--muted);background:none;
  border:none;border-bottom:2px solid transparent;cursor:pointer;
  transition:all .15s;white-space:nowrap;font-family:system-ui,sans-serif;
}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--teal);border-bottom-color:var(--teal);font-weight:500}

#main{flex:1;overflow-y:auto;padding:24px}
.tab-panel{display:none}
.tab-panel.active{display:block}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:20px;box-shadow:var(--shadow);
}
.stat-card .stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.stat-card .stat-value{font-size:28px;font-weight:600;color:var(--text)}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.section-header h2{font-size:18px;font-weight:500}

.table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:var(--surface)}
th{padding:10px 14px;text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(14,207,190,.03)}
.actions-cell{display:flex;gap:6px;flex-wrap:wrap}

.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.badge-green{background:rgba(46,204,113,.15);color:var(--green)}
.badge-red{background:var(--red-dim);color:var(--red)}
.badge-yellow{background:rgba(241,196,15,.15);color:var(--amber)}
.badge-muted{background:rgba(107,115,148,.15);color:var(--muted)}

.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
  align-items:center;justify-content:center;z-index:500;padding:16px;
}
.overlay.open{display:flex}
.modal-box{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:28px;width:100%;max-width:480px;box-shadow:var(--shadow);
  animation:modalIn .2s ease;
}
@keyframes modalIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.modal-title{font-size:20px;font-weight:500;margin-bottom:20px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.form-row{margin-bottom:16px}
.form-row label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500}
.form-row input,.form-row select,.form-row textarea{
  width:100%;padding:9px 12px;background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none;
  font-family:system-ui,sans-serif;transition:border-color .15s;
}
.form-row input:focus,.form-row select:focus{border-color:var(--teal)}
.form-row select{cursor:pointer}
.form-row select option{background:var(--surface);color:var(--text)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}

#toast{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast-msg{
  padding:12px 18px;border-radius:8px;background:var(--card);
  border:1px solid var(--border);font-size:13px;pointer-events:auto;
  animation:toastIn .25s ease;box-shadow:var(--shadow);
}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.toast-msg.success{border-color:var(--green)}
.toast-msg.error{border-color:var(--red);color:var(--red)}
.toast-msg.info{border-color:var(--teal)}

.loading-row td{text-align:center;padding:30px;color:var(--muted)}
.empty-row td{text-align:center;padding:30px;color:var(--muted)}
.mono{font-family:ui-monospace,monospace;font-size:12px}
.truncate{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toggle-sw{position:relative;display:inline-block;width:36px;height:20px}
.toggle-sw input{opacity:0;width:0;height:0}
.toggle-sw .slider{
  position:absolute;inset:0;background:var(--border);border-radius:20px;
  cursor:pointer;transition:.2s;
}
.toggle-sw .slider::before{
  content:'';position:absolute;width:16px;height:16px;left:2px;bottom:2px;
  background:var(--text);border-radius:50%;transition:.2s;
}
.toggle-sw input:checked+.slider{background:var(--teal)}
.toggle-sw input:checked+.slider::before{transform:translateX(16px)}

@media(max-width:768px){
  #topbar{padding:0 14px}
  #hamburger{display:block}
  .admin-email{display:none}
  .tab-bar{padding:0 14px}
  .tab-btn{padding:10px 14px;font-size:12px}
  #main{padding:16px}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{padding:14px}
  .stat-card .stat-value{font-size:22px}
  .modal-box{padding:20px;max-width:100%}
  .form-grid{grid-template-columns:1fr}
  .section-header{flex-direction:column;align-items:flex-start}
  table{font-size:12px}
  th,td{padding:8px 10px}
  .actions-cell{flex-direction:column;gap:4px}
  #toast{bottom:16px;right:16px;left:16px}
}
@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .stat-card .stat-value{font-size:20px}
  .login-card{padding:28px 20px}
  .pin-boxes{gap:8px}
  .pin-box{width:46px;height:52px;font-size:20px}
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>P&L Dashboard <span>Admin</span></h1>
    <p>Sign in with your admin credentials</p>
    <div class="field-group">
      <label>Email</label>
      <input type="email" id="login-email" class="field-input" placeholder="admin@example.com" autocomplete="email">
    </div>
    <div class="field-group">
      <label>PIN</label>
      <div class="pin-boxes">
        <input type="tel" maxlength="1" class="pin-box" data-pin="0" inputmode="numeric" autocomplete="off">
        <input type="tel" maxlength="1" class="pin-box" data-pin="1" inputmode="numeric" autocomplete="off">
        <input type="tel" maxlength="1" class="pin-box" data-pin="2" inputmode="numeric" autocomplete="off">
        <input type="tel" maxlength="1" class="pin-box" data-pin="3" inputmode="numeric" autocomplete="off">
      </div>
    </div>
    <button class="btn-login" id="login-btn">Sign In</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="app-shell">
  <div id="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button id="hamburger">&#9776;</button>
      <h1>P&L Dashboard <span>Admin</span></h1>
    </div>
    <div class="topbar-right">
      <span class="admin-email" id="admin-email-display"></span>
      <button class="btn btn-outline btn-sm" id="signout-btn">Sign Out</button>
    </div>
  </div>
  <div class="tab-bar" id="tab-bar">
    <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
    <button class="tab-btn" data-tab="users">Users</button>
    <button class="tab-btn" data-tab="coupons">Coupons</button>
    <button class="tab-btn" data-tab="logs">Access Log</button>
  </div>
  <div id="main">
    <div class="tab-panel active" id="panel-dashboard">
      <div class="stats-grid" id="stats-grid"></div>
    </div>
    <div class="tab-panel" id="panel-users">
      <div class="section-header">
        <h2>Users</h2>
        <button class="btn btn-primary" id="add-user-btn">+ Add User</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Email</th><th>Name</th><th>Plan</th><th>Status</th>
              <th>Coupon</th><th>PIN</th><th>Expires</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody"><tr class="loading-row"><td colspan="8">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
    <div class="tab-panel" id="panel-coupons">
      <div class="section-header">
        <h2>Coupons</h2>
        <button class="btn btn-primary" id="add-coupon-btn">+ Create Coupon</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Code</th><th>Description</th><th>Plan</th><th>Uses</th>
              <th>Active</th><th>Expires</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="coupons-tbody"><tr class="loading-row"><td colspan="7">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
    <div class="tab-panel" id="panel-logs">
      <div class="section-header">
        <h2>Access Log</h2>
        <button class="btn btn-outline btn-sm" id="refresh-logs-btn">Refresh</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Time</th><th>Email</th><th>Event</th><th>User Agent</th></tr>
          </thead>
          <tbody id="logs-tbody"><tr class="loading-row"><td colspan="4">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="user-modal">
  <div class="modal-box">
    <div class="modal-title" id="user-modal-title">Add User</div>
    <form id="user-form">
      <div class="form-grid">
        <div class="form-row">
          <label>Email</label>
          <input type="email" id="uf-email" required>
        </div>
        <div class="form-row">
          <label>Name</label>
          <input type="text" id="uf-name">
        </div>
        <div class="form-row">
          <label>Plan</label>
          <select id="uf-plan">
            <option value="lifetime">Lifetime</option>
            <option value="7day">7 Day</option>
            <option value="14day">14 Day</option>
            <option value="30day">30 Day</option>
          </select>
        </div>
        <div class="form-row">
          <label>Status</label>
          <select id="uf-status">
            <option value="active">Active</option>
            <option value="suspended">Suspended</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <label>Expires At (optional)</label>
        <input type="datetime-local" id="uf-expires">
      </div>
      <input type="hidden" id="uf-mode" value="add">
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" onclick="closeModal('user-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary" id="uf-submit">Add User</button>
      </div>
    </form>
  </div>
</div>

<div class="overlay" id="coupon-modal">
  <div class="modal-box">
    <div class="modal-title" id="coupon-modal-title">Create Coupon</div>
    <form id="coupon-form">
      <div class="form-grid">
        <div class="form-row">
          <label>Code</label>
          <input type="text" id="cf-code" required>
        </div>
        <div class="form-row">
          <label>Plan</label>
          <select id="cf-plan">
            <option value="lifetime">Lifetime</option>
            <option value="7day">7 Day</option>
            <option value="14day">14 Day</option>
            <option value="30day">30 Day</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <label>Description</label>
        <input type="text" id="cf-desc">
      </div>
      <div class="form-grid">
        <div class="form-row">
          <label>Max Uses</label>
          <input type="number" id="cf-max" min="1" value="1">
        </div>
        <div class="form-row">
          <label>Expires At (optional)</label>
          <input type="datetime-local" id="cf-expires">
        </div>
      </div>
      <div class="form-row" style="display:flex;align-items:center;gap:10px">
        <label style="margin:0">Active</label>
        <label class="toggle-sw">
          <input type="checkbox" id="cf-active" checked>
          <span class="slider"></span>
        </label>
      </div>
      <input type="hidden" id="cf-mode" value="add">
      <input type="hidden" id="cf-orig-code" value="">
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" onclick="closeModal('coupon-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary" id="cf-submit">Create Coupon</button>
      </div>
    </form>
  </div>
</div>

<div class="overlay" id="confirm-modal">
  <div class="modal-box" style="max-width:380px;text-align:center">
    <div class="modal-title" id="confirm-title">Confirm</div>
    <p id="confirm-msg" style="color:var(--muted);margin-bottom:20px"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn btn-outline" onclick="closeModal('confirm-modal')">Cancel</button>
      <button class="btn btn-danger" id="confirm-yes">Confirm</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
var SUPA_URL='https://iknfvddnevudpjtyxkbh.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlrbmZ2ZGRuZXZ1ZHBqdHl4a2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMzMwNzQsImV4cCI6MjA5MjkwOTA3NH0.Ry5ggZ5kH9lfGFpv5zfkJoZeITvneukMRV7H0yUMtwE';

function getSession(){
  var e=sessionStorage.getItem('admin_email');
  var p=sessionStorage.getItem('admin_pin');
  if(e&&p) return {email:e,pin:p};
  return null;
}

function setSession(e,p){
  sessionStorage.setItem('admin_email',e);
  sessionStorage.setItem('admin_pin',p);
}

function clearSession(){
  sessionStorage.removeItem('admin_email');
  sessionStorage.removeItem('admin_pin');
}

async function adminFetch(rpcName,params){
  var res=await fetch(SUPA_URL+'/rest/v1/rpc/'+rpcName,{
    method:'POST',
    headers:{
      'apikey':SUPA_KEY,
      'Authorization':'Bearer '+SUPA_KEY,
      'Content-Type':'application/json',
      'Prefer':''
    },
    body:JSON.stringify(params)
  });
  if(!res.ok){
    var txt='';
    try{txt=await res.text()}catch(x){}
    throw new Error('Error '+res.status+(txt?': '+txt:''));
  }
  var text=await res.text();
  return text?JSON.parse(text):{};
}

async function rpc(name,extra){
  var s=getSession();
  if(!s) throw new Error('Not authenticated');
  var params=Object.assign({p_email:s.email,p_pin:s.pin},extra||{});
  var d=await adminFetch(name,params);
  if(d&&d.success===false) throw new Error(d.error||'Operation failed');
  return d;
}

function showToast(msg,type){
  var t=document.getElementById('toast');
  var el=document.createElement('div');
  el.className='toast-msg '+(type||'info');
  el.textContent=msg;
  t.appendChild(el);
  setTimeout(function(){el.remove()},4000);
}

function openModal(id){document.getElementById(id).classList.add('open')}
function closeModal(id){document.getElementById(id).classList.remove('open')}

function fmtDate(d){
  if(!d) return '—';
  var dt=new Date(d);
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' '+dt.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}

function statusBadge(status,expiresAt){
  if(status==='suspended') return '<span class="badge badge-red">Suspended</span>';
  if(expiresAt&&new Date(expiresAt)<new Date()) return '<span class="badge badge-yellow">Expired</span>';
  if(status==='active') return '<span class="badge badge-green">Active</span>';
  return '<span class="badge badge-muted">'+status+'</span>';
}

function planLabel(p){
  var m={lifetime:'Lifetime','7day':'7 Day','14day':'14 Day','30day':'30 Day'};
  return m[p]||p||'—';
}

function esc(s){
  if(!s) return '';
  var d=document.createElement('div');
  d.textContent=s;
  return d.innerHTML;
}

var pinBoxes=document.querySelectorAll('.pin-box');
pinBoxes.forEach(function(box,i){
  box.addEventListener('input',function(){
    this.value=this.value.replace(/\D/g,'').slice(0,1);
    if(this.value&&i<3) pinBoxes[i+1].focus();
  });
  box.addEventListener('keydown',function(e){
    if(e.key==='Backspace'&&!this.value&&i>0){
      pinBoxes[i-1].focus();
      pinBoxes[i-1].value='';
    }
    if(e.key==='Enter') document.getElementById('login-btn').click();
  });
  box.addEventListener('paste',function(e){
    e.preventDefault();
    var paste=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,4);
    for(var j=0;j<paste.length&&j<4;j++){
      pinBoxes[j].value=paste[j];
    }
    if(paste.length>0) pinBoxes[Math.min(paste.length,3)].focus();
  });
});

function getPin(){
  var p='';
  pinBoxes.forEach(function(b){p+=b.value});
  return p;
}

document.getElementById('login-btn').addEventListener('click',async function(){
  var email=document.getElementById('login-email').value.trim();
  var pin=getPin();
  var errEl=document.getElementById('login-error');
  errEl.textContent='';
  if(!email){errEl.textContent='Enter your email';return}
  if(pin.length!==4){errEl.textContent='Enter your 4-digit PIN';return}
  try{
    setSession(email,pin);
    var d=await rpc('admin_get_stats');
    showApp();
    loadDashboard(d);
  }catch(e){
    clearSession();
    errEl.textContent='Authentication failed. Check email and PIN.';
  }
});

document.getElementById('signout-btn').addEventListener('click',function(){
  clearSession();
  showLogin();
});

function showLogin(){
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app-shell').style.display='none';
  document.getElementById('login-email').value='';
  pinBoxes.forEach(function(b){b.value=''});
  document.getElementById('login-error').textContent='';
}

function showApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-shell').style.display='flex';
  document.getElementById('admin-email-display').textContent=getSession().email;
}

document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});
    document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active')});
    btn.classList.add('active');
    var panel=document.getElementById('panel-'+btn.dataset.tab);
    panel.classList.add('active');
    if(btn.dataset.tab==='dashboard') loadDashboard();
    if(btn.dataset.tab==='users') loadUsers();
    if(btn.dataset.tab==='coupons') loadCoupons();
    if(btn.dataset.tab==='logs') loadLogs();
  });
});

async function loadDashboard(data){
  try{
    var d=data||await rpc('admin_get_stats');
    var items=[
      {label:'Total Users',value:d.total_users},
      {label:'Active Users',value:d.active_users},
      {label:'Coupons',value:d.total_coupons},
      {label:'Active Coupons',value:d.active_coupons},
      {label:'Redeemed',value:d.total_redeemed},
      {label:'Logins Today',value:d.logins_today}
    ];
    var html='';
    items.forEach(function(it){
      html+='<div class="stat-card"><div class="stat-label">'+esc(it.label)+'</div><div class="stat-value">'+(it.value!=null?it.value:'—')+'</div></div>';
    });
    document.getElementById('stats-grid').innerHTML=html;
  }catch(e){
    showToast('Failed to load stats: '+e.message,'error');
  }
}

var usersCache=[];

async function loadUsers(){
  var tbody=document.getElementById('users-tbody');
  tbody.innerHTML='<tr class="loading-row"><td colspan="8">Loading...</td></tr>';
  try{
    var d=await rpc('admin_list_users');
    usersCache=d.users||[];
    if(!usersCache.length){
      tbody.innerHTML='<tr class="empty-row"><td colspan="8">No users found</td></tr>';
      return;
    }
    var html='';
    usersCache.forEach(function(u){
      html+='<tr>';
      html+='<td class="mono">'+esc(u.email)+'</td>';
      html+='<td>'+esc(u.name||'—')+'</td>';
      html+='<td>'+planLabel(u.plan)+'</td>';
      html+='<td>'+statusBadge(u.status,u.expires_at)+'</td>';
      html+='<td class="mono">'+(u.coupon_code?esc(u.coupon_code):'—')+'</td>';
      html+='<td>'+(u.has_pin?'<span class="badge badge-green">Yes</span>':'<span class="badge badge-muted">No</span>')+'</td>';
      html+='<td style="font-size:12px">'+fmtDate(u.expires_at)+'</td>';
      html+='<td><div class="actions-cell">';
      html+='<button class="btn btn-outline btn-sm" onclick="editUser(\''+esc(u.email)+'\')">Edit</button>';
      if(u.status==='active'){
        html+='<button class="btn btn-outline btn-sm" onclick="toggleUserStatus(\''+esc(u.email)+'\',\'suspended\')">Suspend</button>';
      }else{
        html+='<button class="btn btn-outline btn-sm" onclick="toggleUserStatus(\''+esc(u.email)+'\',\'active\')">Activate</button>';
      }
      if(u.has_pin){
        html+='<button class="btn btn-outline btn-sm" onclick="resetUserPin(\''+esc(u.email)+'\')">Reset PIN</button>';
      }
      html+='<button class="btn btn-danger btn-sm" onclick="deleteUser(\''+esc(u.email)+'\')">Delete</button>';
      html+='</div></td>';
      html+='</tr>';
    });
    tbody.innerHTML=html;
  }catch(e){
    tbody.innerHTML='<tr class="empty-row"><td colspan="8">Error: '+esc(e.message)+'</td></tr>';
    showToast('Failed to load users','error');
  }
}

document.getElementById('add-user-btn').addEventListener('click',function(){
  document.getElementById('user-modal-title').textContent='Add User';
  document.getElementById('uf-submit').textContent='Add User';
  document.getElementById('uf-mode').value='add';
  document.getElementById('uf-email').value='';
  document.getElementById('uf-email').disabled=false;
  document.getElementById('uf-name').value='';
  document.getElementById('uf-plan').value='lifetime';
  document.getElementById('uf-status').value='active';
  document.getElementById('uf-expires').value='';
  openModal('user-modal');
});

function editUser(email){
  var u=usersCache.find(function(x){return x.email===email});
  if(!u) return;
  document.getElementById('user-modal-title').textContent='Edit User';
  document.getElementById('uf-submit').textContent='Save Changes';
  document.getElementById('uf-mode').value='edit';
  document.getElementById('uf-email').value=u.email;
  document.getElementById('uf-email').disabled=true;
  document.getElementById('uf-name').value=u.name||'';
  document.getElementById('uf-plan').value=u.plan||'lifetime';
  document.getElementById('uf-status').value=u.status||'active';
  document.getElementById('uf-expires').value=u.expires_at?u.expires_at.slice(0,16):'';
  openModal('user-modal');
}

document.getElementById('user-form').addEventListener('submit',async function(e){
  e.preventDefault();
  var mode=document.getElementById('uf-mode').value;
  var email=document.getElementById('uf-email').value.trim();
  var name=document.getElementById('uf-name').value.trim();
  var plan=document.getElementById('uf-plan').value;
  var status=document.getElementById('uf-status').value;
  var expires=document.getElementById('uf-expires').value||null;
  try{
    if(mode==='add'){
      var params={p_user_email:email,p_user_name:name||null,p_plan:plan,p_status:status,p_expires_at:expires};
      var r=await rpc('admin_add_user',params);
      showToast('User added. License: '+(r.license_key||'N/A'),'success');
    }else{
      var editU=usersCache.find(function(x){return x.email===email});
      var hadExpiry=editU&&editU.expires_at;
      var clearExpiry=hadExpiry&&!expires?true:false;
      var params={p_user_email:email,p_name:name||null,p_plan:plan,p_status:status,p_expires_at:expires,p_clear_expiry:clearExpiry};
      await rpc('admin_update_user',params);
      showToast('User updated','success');
    }
    closeModal('user-modal');
    loadUsers();
  }catch(err){
    showToast('Error: '+err.message,'error');
  }
});

async function toggleUserStatus(email,newStatus){
  try{
    await rpc('admin_update_user',{p_user_email:email,p_name:null,p_plan:null,p_status:newStatus,p_expires_at:null,p_clear_expiry:false});
    showToast('User '+(newStatus==='active'?'activated':'suspended'),'success');
    loadUsers();
  }catch(e){
    showToast('Error: '+e.message,'error');
  }
}

function resetUserPin(email){
  confirmAction('Reset PIN','Reset PIN for '+email+'?',async function(){
    try{
      await rpc('admin_reset_user_pin',{p_user_email:email});
      showToast('PIN reset for '+email,'success');
      loadUsers();
    }catch(e){
      showToast('Error: '+e.message,'error');
    }
  });
}

function deleteUser(email){
  confirmAction('Delete User','Permanently delete '+email+'? This cannot be undone.',async function(){
    try{
      await rpc('admin_delete_user',{p_user_email:email});
      showToast('User deleted','success');
      loadUsers();
    }catch(e){
      showToast('Error: '+e.message,'error');
    }
  });
}

var couponsCache=[];

async function loadCoupons(){
  var tbody=document.getElementById('coupons-tbody');
  tbody.innerHTML='<tr class="loading-row"><td colspan="7">Loading...</td></tr>';
  try{
    var d=await rpc('admin_list_coupons');
    couponsCache=d.coupons||[];
    if(!couponsCache.length){
      tbody.innerHTML='<tr class="empty-row"><td colspan="7">No coupons found</td></tr>';
      return;
    }
    var html='';
    couponsCache.forEach(function(c){
      html+='<tr>';
      html+='<td class="mono" style="font-weight:600">'+esc(c.code)+'</td>';
      html+='<td>'+esc(c.description||'—')+'</td>';
      html+='<td>'+planLabel(c.plan)+'</td>';
      html+='<td>'+c.uses_count+' / '+(c.max_uses||'&infin;')+'</td>';
      html+='<td>'+(c.active?'<span class="badge badge-green">Active</span>':'<span class="badge badge-muted">Inactive</span>')+'</td>';
      html+='<td style="font-size:12px">'+fmtDate(c.expires_at)+'</td>';
      html+='<td><div class="actions-cell">';
      html+='<button class="btn btn-outline btn-sm" onclick="editCoupon(\''+esc(c.code)+'\')">Edit</button>';
      html+='<button class="btn btn-outline btn-sm" onclick="toggleCoupon(\''+esc(c.code)+'\','+(!c.active)+')">'+(c.active?'Deactivate':'Activate')+'</button>';
      html+='</div></td>';
      html+='</tr>';
    });
    tbody.innerHTML=html;
  }catch(e){
    tbody.innerHTML='<tr class="empty-row"><td colspan="7">Error: '+esc(e.message)+'</td></tr>';
    showToast('Failed to load coupons','error');
  }
}

document.getElementById('add-coupon-btn').addEventListener('click',function(){
  document.getElementById('coupon-modal-title').textContent='Create Coupon';
  document.getElementById('cf-submit').textContent='Create Coupon';
  document.getElementById('cf-mode').value='add';
  document.getElementById('cf-orig-code').value='';
  document.getElementById('cf-code').value='';
  document.getElementById('cf-code').disabled=false;
  document.getElementById('cf-desc').value='';
  document.getElementById('cf-plan').value='lifetime';
  document.getElementById('cf-max').value='1';
  document.getElementById('cf-active').checked=true;
  document.getElementById('cf-expires').value='';
  openModal('coupon-modal');
});

function editCoupon(code){
  var c=couponsCache.find(function(x){return x.code===code});
  if(!c) return;
  document.getElementById('coupon-modal-title').textContent='Edit Coupon';
  document.getElementById('cf-submit').textContent='Save Changes';
  document.getElementById('cf-mode').value='edit';
  document.getElementById('cf-orig-code').value=c.code;
  document.getElementById('cf-code').value=c.code;
  document.getElementById('cf-code').disabled=true;
  document.getElementById('cf-desc').value=c.description||'';
  document.getElementById('cf-plan').value=c.plan||'lifetime';
  document.getElementById('cf-max').value=c.max_uses||'';
  document.getElementById('cf-active').checked=!!c.active;
  document.getElementById('cf-expires').value=c.expires_at?c.expires_at.slice(0,16):'';
  openModal('coupon-modal');
}

document.getElementById('coupon-form').addEventListener('submit',async function(e){
  e.preventDefault();
  var mode=document.getElementById('cf-mode').value;
  var code=document.getElementById('cf-code').value.trim();
  var desc=document.getElementById('cf-desc').value.trim();
  var plan=document.getElementById('cf-plan').value;
  var maxUses=parseInt(document.getElementById('cf-max').value)||null;
  var active=document.getElementById('cf-active').checked;
  var expires=document.getElementById('cf-expires').value||null;
  try{
    if(mode==='add'){
      await rpc('admin_create_coupon',{p_code:code,p_description:desc||null,p_plan:plan,p_max_uses:maxUses,p_active:active,p_expires_at:expires});
      showToast('Coupon created','success');
    }else{
      await rpc('admin_update_coupon',{p_code:document.getElementById('cf-orig-code').value,p_description:desc||null,p_plan:plan,p_max_uses:maxUses,p_active:active,p_expires_at:expires});
      showToast('Coupon updated','success');
    }
    closeModal('coupon-modal');
    loadCoupons();
  }catch(err){
    showToast('Error: '+err.message,'error');
  }
});

async function toggleCoupon(code,active){
  try{
    var c=couponsCache.find(function(x){return x.code===code});
    await rpc('admin_update_coupon',{p_code:code,p_description:c?c.description:null,p_plan:c?c.plan:null,p_max_uses:c?c.max_uses:null,p_active:active,p_expires_at:c?c.expires_at:null});
    showToast('Coupon '+(active?'activated':'deactivated'),'success');
    loadCoupons();
  }catch(e){
    showToast('Error: '+e.message,'error');
  }
}

async function loadLogs(){
  var tbody=document.getElementById('logs-tbody');
  tbody.innerHTML='<tr class="loading-row"><td colspan="4">Loading...</td></tr>';
  try{
    var d=await rpc('admin_list_access_log',{p_limit:100});
    var logs=d.logs||[];
    if(!logs.length){
      tbody.innerHTML='<tr class="empty-row"><td colspan="4">No logs found</td></tr>';
      return;
    }
    var html='';
    logs.forEach(function(l){
      html+='<tr>';
      html+='<td style="font-size:12px;white-space:nowrap">'+fmtDate(l.created_at)+'</td>';
      html+='<td class="mono">'+esc(l.email||'—')+'</td>';
      html+='<td>'+esc(l.event||'—')+'</td>';
      html+='<td class="truncate" title="'+esc(l.user_agent||'')+'">'+esc(l.user_agent||'—')+'</td>';
      html+='</tr>';
    });
    tbody.innerHTML=html;
  }catch(e){
    tbody.innerHTML='<tr class="empty-row"><td colspan="4">Error: '+esc(e.message)+'</td></tr>';
    showToast('Failed to load logs','error');
  }
}

document.getElementById('refresh-logs-btn').addEventListener('click',function(){loadLogs()});

var logsInterval;
document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    clearInterval(logsInterval);
    if(btn.dataset.tab==='logs'){
      logsInterval=setInterval(loadLogs,30000);
    }
  });
});

function confirmAction(title,msg,onYes){
  document.getElementById('confirm-title').textContent=title;
  document.getElementById('confirm-msg').textContent=msg;
  var yesBtn=document.getElementById('confirm-yes');
  var newBtn=yesBtn.cloneNode(true);
  yesBtn.parentNode.replaceChild(newBtn,yesBtn);
  newBtn.addEventListener('click',function(){
    closeModal('confirm-modal');
    onYes();
  });
  openModal('confirm-modal');
}

document.querySelectorAll('.overlay').forEach(function(ov){
  ov.addEventListener('click',function(e){
    if(e.target===ov) closeModal(ov.id);
  });
});

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    document.querySelectorAll('.overlay.open').forEach(function(ov){closeModal(ov.id)});
  }
});

document.getElementById('hamburger').addEventListener('click',function(){
  var bar=document.getElementById('tab-bar');
  bar.style.display=bar.style.display==='none'?'flex':'none';
});

(function init(){
  var s=getSession();
  if(s){
    showApp();
    loadDashboard();
  }else{
    showLogin();
  }
})();
</script>
</body>
</html>
