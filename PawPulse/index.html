<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PawPulse 🐾 — Cavapoo Care Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c3aed">
<style>
:root {
  --primary:#7c3aed; --primary-light:#ede9fe; --primary-dark:#5b21b6;
  --accent:#f59e0b; --accent-light:#fef3c7;
  --success:#16a34a; --danger:#dc2626; --warning:#d97706; --info:#0284c7;
  --bg:#f5f3ff; --card:#ffffff; --border:#e5e7eb;
  --text1:#1e1b4b; --text2:#4b5563; --text3:#9ca3af;
  --radius:12px; --shadow:0 2px 8px rgba(124,58,237,.10);
  --font:'Segoe UI',system-ui,sans-serif;
}
[data-theme="dark"] {
  --bg:#0f0a1e; --card:#1a1035; --border:#2d2060;
  --text1:#f0ecff; --text2:#a89fd4; --text3:#6b5fa0;
  --primary-light:#2d1f6e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text1);min-height:100vh;}
header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(124,58,237,.3);flex-wrap:wrap;gap:8px;}
.logo{font-size:1.5rem;font-weight:700;letter-spacing:-.5px;}  .logo span{opacity:.8;font-size:1rem;font-weight:400;}
.header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.btn{border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.85rem;font-weight:600;transition:.2s;}
.btn-ghost{background:rgba(255,255,255,.15);color:#fff;}.btn-ghost:hover{background:rgba(255,255,255,.25);}
.btn-primary{background:var(--primary);color:#fff;}.btn-primary:hover{background:var(--primary-dark);}
.btn-sm{padding:5px 10px;font-size:.78rem;}
nav{background:var(--card);border-bottom:2px solid var(--border);padding:0 24px;display:flex;gap:4px;overflow-x:auto;}
.nav-tab{padding:12px 16px;cursor:pointer;border:none;background:none;font-size:.86rem;font-weight:600;color:var(--text2);border-bottom:3px solid transparent;white-space:nowrap;transition:.2s;}
.nav-tab.active{color:var(--primary);border-bottom-color:var(--primary);}
.nav-tab:hover{color:var(--primary);}
main{padding:24px;max-width:1400px;margin:0 auto;}
.panel{display:none;} .panel.active{display:block;}
.grid-4{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:24px;}
.grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:20px;margin-bottom:24px;}
.grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:24px;}
.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid var(--border);}
.kpi{text-align:center;}
.kpi-icon{font-size:2rem;margin-bottom:8px;}
.kpi-val{font-size:1.8rem;font-weight:700;color:var(--primary);}
.kpi-label{font-size:.8rem;color:var(--text3);margin-top:4px;text-transform:uppercase;letter-spacing:.5px;}
.kpi-sub{font-size:.82rem;color:var(--text2);margin-top:6px;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600;}
.badge-green{background:#dcfce7;color:#166534;} .badge-yellow{background:#fef9c3;color:#854d0e;}
.badge-red{background:#fee2e2;color:#991b1b;} .badge-blue{background:#dbeafe;color:#1e40af;}
.badge-purple{background:var(--primary-light);color:var(--primary-dark);}
.section-title{display:block;font-size:1.1rem;font-weight:700;color:var(--text1);margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid var(--primary-light);}
table{width:100%;border-collapse:collapse;font-size:.86rem;}
th{background:var(--primary-light);color:var(--primary-dark);padding:10px 12px;text-align:left;font-weight:700;}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;}
tr:hover td{background:var(--bg);}
.timeline{list-style:none;}
.timeline li{position:relative;padding:12px 12px 12px 36px;border-left:2px solid var(--primary-light);margin-left:12px;}
.timeline li:before{content:attr(data-icon);position:absolute;left:-14px;top:10px;background:var(--card);border:2px solid var(--primary);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:.85rem;}
.timeline li:last-child{border-left:2px solid transparent;}
.progress-bar{background:var(--border);border-radius:20px;height:8px;overflow:hidden;margin-top:6px;}
.progress-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .5s;}
.alert-banner{background:var(--accent-light);border:1px solid var(--accent);border-radius:10px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:12px;}
.alert-banner .icon{font-size:1.4rem;}
.checklist{list-style:none;}
.checklist li{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.checklist li:last-child{border-bottom:none;}
.checklist input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary);cursor:pointer;flex-shrink:0;margin-top:2px;}
.checklist label{cursor:pointer;font-size:.9rem;line-height:1.4;}
.checklist input:checked + label{text-decoration:line-through;color:var(--text3);}
.meal-card{background:linear-gradient(135deg,var(--primary-light),#fff0);border-radius:var(--radius);padding:16px;border:1px solid var(--primary-light);}
.meal-time{font-size:1.3rem;font-weight:700;color:var(--primary);}
.meal-items{margin-top:8px;font-size:.88rem;color:var(--text2);line-height:1.8;}
.tip-card{background:var(--card);border-left:4px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
.tip-card .tip-title{font-weight:700;font-size:.9rem;margin-bottom:4px;}
.tip-card .tip-body{font-size:.85rem;color:var(--text2);}
canvas{max-width:100%;}
.store-card{border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:8px;}
.alert-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;margin-bottom:8px;border:1px solid;}
.alert-urgent{background:#fee2e2;border-color:#fca5a5;}
.alert-soon{background:#fef9c3;border-color:#fde68a;}
.alert-ok{background:#dcfce7;border-color:#86efac;}
.supply-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.supply-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;}
.supply-status{font-size:.75rem;color:var(--text2);margin-top:4px;}
footer{text-align:center;padding:20px;color:var(--text3);font-size:.8rem;border-top:1px solid var(--border);margin-top:40px;}
@media(max-width:600px){header{flex-direction:column;gap:10px;text-align:center;}.grid-2{grid-template-columns:1fr;}.grid-4{grid-template-columns:repeat(2,1fr);}}
.notification-dot{width:8px;height:8px;background:var(--danger);border-radius:50%;display:inline-block;margin-left:4px;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.toggle-switch{position:relative;display:inline-block;width:46px;height:24px;}
.toggle-switch input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#ccc;border-radius:24px;transition:.3s;}
.toggle-slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background-color:white;border-radius:50%;transition:.3s;}
input:checked + .toggle-slider{background-color:var(--primary);}
input:checked + .toggle-slider:before{transform:translateX(22px);}
.vet-card{border:1px solid var(--border);border-radius:var(--radius);padding:16px;background:var(--card);}
.vet-name{font-weight:700;font-size:1rem;color:var(--primary-dark);}
.vet-rating{color:var(--accent);font-weight:600;}
a{color:var(--primary);text-decoration:none;}
a:hover{text-decoration:underline;}
</style>
</head>
<body>

<header>
  <div class="logo">🐾 PawPulse <span>— Cavapoo Care Tracker</span></div>
  <div class="header-actions">
    <span id="dog-name-display" style="font-weight:600;font-size:1rem;">🐶 Puppy (TBD)</span>
    <button class="btn btn-ghost btn-sm" onclick="toggleTheme()">🌙 Theme</button>
    <button class="btn btn-ghost btn-sm" onclick="showSettings()">⚙️ Settings</button>
    <button class="btn btn-ghost btn-sm" onclick="exportData()">⬇️ Export</button>
    <button class="btn btn-ghost btn-sm" onclick="document.getElementById('import-file').click()">⬆️ Import</button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
  </div>
</header>

<nav>
  <button class="nav-tab active" onclick="switchTab('dashboard')">📊 Dashboard</button>
  <button class="nav-tab" onclick="switchTab('health')">💉 Health & Vaccines<span class="notification-dot" id="health-dot"></span></button>
  <button class="nav-tab" onclick="switchTab('vets')">🏥 Vet & Insurance</button>
  <button class="nav-tab" onclick="switchTab('meals')">🍽️ Meals & Nutrition</button>
  <button class="nav-tab" onclick="switchTab('training')">🎓 Training</button>
  <button class="nav-tab" onclick="switchTab('grooming')">✂️ Grooming</button>
  <button class="nav-tab" onclick="switchTab('supplies')">🛒️ Supplies</button>
  <button class="nav-tab" onclick="switchTab('food-prices')">💰 Food & Prices</button>
  <button class="nav-tab" onclick="switchTab('timeline')">📅 Timeline</button>
  <button class="nav-tab" onclick="switchTab('checklist')">✅ Checklists</button>
  <button class="nav-tab" onclick="switchTab('notifications')">🔔 Alerts Setup</button>
</nav>

<main>
<p style='text-align:center;color:#888;'>[Content truncated for transport - full content in previous message]</p>
</main>

<footer>🐾 PawPulse — Cavapoo Care Tracker | apatel85/Dashboards | Data stored locally in your browser</footer>
</body>
</html>
